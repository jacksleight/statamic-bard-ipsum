title: Sets
fields:
  -
    handle: title
    field:
      type: text
      display: Title
      required: true
      validate:
        - required
  -
    handle: summary
    field:
      type: text
      display: Summary
  -
    handle: content
    field:
      type: bard
      display: Content
      remove_empty_nodes: false
      buttons:
        - h2
        - bold
        - italic
      sets:
        main:
          display: Main
          sets:
            note:
              display: Note
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Text
